<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨境多模态AI工具箱</title>
    <meta name="description" content="跨境多模态AI工具箱 - 智能图片与视频生成平台">
    <link rel="preconnect" href="https://fonts.loli.net">
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/new-app.css?v=20260309g">
    <style>
        /* Index-specific hero styles */
        .hero-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 40px 24px;
            position: relative;
            min-height: 100vh;
        }

        #particles-js {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .hero-content {
            max-width: 900px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .hero-icon {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 12px 40px rgba(37, 99, 235, 0.3);
            animation: floatY 3s ease-in-out infinite;
        }

        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .hero-icon svg {
            width: 40px;
            height: 40px;
            color: white;
        }

        .hero-title {
            font-size: 36px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .hero-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 48px;
            line-height: 1.6;
        }

        .feature-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .feature-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 20px;
        }

        .feature-card.image-card::before {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.05), rgba(124, 58, 237, 0.05));
        }

        .feature-card.video-card::before {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.05), rgba(251, 146, 60, 0.05));
        }

        .feature-card.refund-card::before {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.05), rgba(6, 182, 212, 0.05));
        }

        .feature-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.1);
            border-color: transparent;
        }

        .feature-card:hover::before {
            opacity: 1;
        }

        .feature-card-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .image-card .feature-card-icon {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
        }

        .video-card .feature-card-icon {
            background: linear-gradient(135deg, #f43f5e, #fb923c);
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.3);
        }

        .refund-card .feature-card-icon {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .hero-content { max-width: 1140px; }
        .selection-card .feature-card-icon { background: linear-gradient(135deg, #7c3aed, #a855f7); box-shadow: 0 6px 20px rgba(124, 58, 237, 0.25); }
        .selection-card:hover .feature-card-arrow { background: #7c3aed; color: white; }
        .selection-card::before { background: linear-gradient(135deg, rgba(124, 58, 237, .05), rgba(168, 85, 247, .05)); }

        .feature-card-icon svg {
            width: 28px;
            height: 28px;
            color: white;
        }

        .feature-card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .feature-card-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .feature-card-arrow {
            margin-top: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }

        .feature-card:hover .feature-card-arrow {
            transform: translateX(4px);
        }

        .image-card:hover .feature-card-arrow {
            background: var(--primary);
            color: white;
        }

        .video-card:hover .feature-card-arrow {
            background: #f43f5e;
            color: white;
        }

        .refund-card:hover .feature-card-arrow {
            background: #10b981;
            color: white;
        }

        .feature-card-arrow svg {
            width: 16px;
            height: 16px;
        }

        .hero-footer {
            margin-top: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .hero-footer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .hero-footer-item svg {
            width: 16px;
            height: 16px;
            color: var(--success);
        }

        @media (max-width: 768px) {
            .feature-cards {
                grid-template-columns: 1fr;
            }

            .hero-title {
                font-size: 26px;
            }
        }

        @media (min-width: 769px) and (max-width: 1180px) {
            .feature-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- Hero Content -->
        <div class="hero-wrapper">
            <div id="particles-js"></div>
            <div class="hero-content">
                <div class="hero-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                    </svg>
                </div>
                <h1 class="hero-title">星骏跨境多模态AI工具箱</h1>
                <p class="hero-subtitle">图片生成、跨境视频制作、退款分析与 AI 选品，一站式开启跨境创作</p>

                <div class="feature-cards">
                    <a class="feature-card image-card" href="/pages/image.html">
                        <div class="feature-card-icon">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <div class="feature-card-title">图片生成</div>
                        <div class="feature-card-desc">AI 智能图片生成，支持多种模型与尺寸，上传参考图即可生成创意素材</div>
                        <div class="feature-card-arrow">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5l7 7-7 7" />
                            </svg>
                        </div>
                    </a>

                    <a class="feature-card video-card" href="/pages/video.html">
                        <div class="feature-card-icon">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <div class="feature-card-title">视频生成</div>
                        <div class="feature-card-desc">跨境电商爆款视频智能生成，录入需求后由 AI 自动生成高质量商品视频</div>
                        <div class="feature-card-arrow">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5l7 7-7 7" />
                            </svg>
                        </div>
                    </a>

                    <a class="feature-card refund-card" href="/refund/">
                        <div class="feature-card-icon">
                            <!-- 退款/数据分析图标 -->
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                            </svg>
                        </div>
                        <div class="feature-card-title">退款分析</div>
                        <div class="feature-card-desc">退款看板与深度原因分析，按商品、颜色和部位探索退款问题</div>
                        <div class="feature-card-arrow">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5l7 7-7 7" />
                            </svg>
                        </div>
                    </a>
                    <a class="feature-card selection-card" href="/selection/">
                        <div class="feature-card-icon">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-5-5m2-6a7 7 0 11-14 0 7 7 0 0114 0zM11 7v6m-3-3h6" /></svg>
                        </div>
                        <div class="feature-card-title">AI 选品</div>
                        <div class="feature-card-desc">从商品收藏到竞品报告与改款对比，体验历史真实数据的完整选品流程</div>
                        <div class="feature-card-arrow"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg></div>
                    </a>
                </div>

                <div class="hero-footer">
                    <div class="hero-footer-item">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        多模型支持
                    </div>
                    <div class="hero-footer-item">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        商用级品质
                    </div>
                    <div class="hero-footer-item">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        跨境合规
                    </div>
                    <div class="hero-footer-item">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        一键生成
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // 纯静态页面，无需登录，无需 Vue
        // 仅初始化粒子背景动效
        document.addEventListener('DOMContentLoaded', function () {
            if (window.particlesJS) {
                particlesJS("particles-js", {
                    "particles": {
                        "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                        "color": { "value": "#2563eb" },
                        "shape": { "type": "circle" },
                        "opacity": { "value": 0.4, "random": false },
                        "size": { "value": 3, "random": true },
                        "line_linked": {
                            "enable": true,
                            "distance": 150,
                            "color": "#3b82f6",
                            "opacity": 0.3,
                            "width": 1
                        },
                        "move": {
                            "enable": true,
                            "speed": 1.5,
                            "direction": "none",
                            "random": false,
                            "straight": false,
                            "out_mode": "out",
                            "bounce": false
                        }
                    },
                    "interactivity": {
                        "detect_on": "canvas",
                        "events": {
                            "onhover": { "enable": false },
                            "onclick": { "enable": false },
                            "resize": true
                        }
                    },
                    "retina_detect": true
                });
            }
        });
    </script>
</body>

</html>
