
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 星骏AI</title>
    <meta name="description" content="登录 星骏AI，开始您的 AI 创作之旅">
    <link rel="preconnect" href="https://fonts.loli.net">
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0a0a1a;
        }

        /* 动态背景 */
        .bg-animation {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 40% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
            animation: bgRotate 30s linear infinite;
        }

        @keyframes bgRotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 浮动粒子 */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float linear infinite;
            opacity: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* 网格线 */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* 主容器 */
        .login-container {
            position: relative;
            z-index: 10;
            display: flex;
            width: 900px;
            max-width: 95vw;
            min-height: 560px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }

        /* 左侧品牌区 */
        .brand-panel {
            flex: 1;
            background: linear-gradient(135deg, #1a1a3e 0%, #0f0f2e 50%, #1a0a2e 100%);
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .brand-panel::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            animation: pulse 4s ease-in-out infinite;
        }

        .brand-panel::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            bottom: -60px;
            left: -60px;
            animation: pulse 5s ease-in-out infinite reverse;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .brand-logo .icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
        }

        .brand-logo .icon svg {
            width: 28px;
            height: 28px;
            color: white;
        }

        .brand-logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.5px;
        }

        .brand-tagline {
            position: relative;
            z-index: 1;
        }

        .brand-tagline h2 {
            font-size: 28px;
            font-weight: 700;
            color: white;
            line-height: 1.3;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 0%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-tagline p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.7;
        }

        .brand-features {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .brand-feature {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .brand-feature .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
        }

        /* 右侧表单区 */
        .form-panel {
            flex: 1;
            background: rgba(15, 15, 30, 0.95);
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 1px solid rgba(255, 255, 255, 0.06);
        }

        .form-header {
            margin-bottom: 32px;
        }

        .form-header h3 {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
        }

        /* 表单切换标签 */
        .form-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 28px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .form-tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.3s ease;
            border: none;
            background: none;
        }

        .form-tab:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-tab.active {
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            color: white;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        /* 表单输入 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-input-wrapper {
            position: relative;
        }

        .form-input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            width: 18px;
            height: 18px;
            transition: color 0.3s;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 44px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .form-input:focus {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(99, 102, 241, 0.05);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-input:focus+.input-icon,
        .form-input:focus~.input-icon {
            color: #6366f1;
        }

        /* 按钮 */
        .btn-primary {
            width: 100%;
            padding: 13px 24px;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(99, 102, 241, 0.3);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover::before {
            opacity: 1;
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast 消息 */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .toast.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        /* 页脚文字 */
        .form-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
        }

        .form-footer a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .form-footer a:hover {
            color: #6366f1;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                min-height: auto;
                margin: 16px;
                max-height: 95vh;
            }

            .brand-panel {
                padding: 32px 24px;
            }

            .brand-tagline h2 {
                font-size: 22px;
            }

            .brand-features {
                display: none;
            }

            .form-panel {
                padding: 32px 24px;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.06);
            }
        }

        /* 过渡动画 */
        .slide-enter {
            opacity: 0;
            transform: translateX(20px);
        }

        .slide-leave {
            opacity: 0;
            transform: translateX(-20px);
        }

        [v-cloak] {
            display: none !important;
        }
    </style>
</head>

<body>
    <!-- 动态背景 -->
    <div class="bg-animation"></div>
    <div class="grid-overlay"></div>
    <div class="particles" id="particles"></div>

    <div id="app" v-cloak>
        <!-- Toast -->
        <div :class="['toast', toast.type, toast.show ? 'show' : '']">
            <svg v-if="toast.type === 'success'" width="16" height="16" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <svg v-if="toast.type === 'error'" width="16" height="16" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            {{ toast.message }}
        </div>

        <div class="login-container">
            <!-- 左侧品牌 -->
            <div class="brand-panel">
                <div class="brand-logo">
                    <div class="icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                    </div>
                    <h1>星骏AI</h1>
                </div>

                <div class="brand-tagline">
                    <h2>释放创意的力量<br>AI 驱动图像创作</h2>
                    <p>上传照片，输入你的想象，让 AI 为你创造无限可能</p>
                </div>

                <div class="brand-features">
                    <div class="brand-feature">
                        <span class="dot"></span>
                        <span>多模型支持，按需选择</span>
                    </div>
                    <div class="brand-feature">
                        <span class="dot"></span>
                        <span>高清 4K 分辨率输出</span>
                    </div>
                    <div class="brand-feature">
                        <span class="dot"></span>
                        <span>智能积分系统，灵活计费</span>
                    </div>
                    <div class="brand-feature">
                        <span class="dot"></span>
                        <span>完整创作历史，随时回顾</span>
                    </div>
                </div>
            </div>

            <!-- 右侧表单 -->
            <div class="form-panel">
                <div class="form-header">
                    <h3>{{ isLogin ? '欢迎回来' : '创建账户' }}</h3>
                    <p>{{ isLogin ? '登录您的账户以继续' : '注册一个新账户开始创作' }}</p>
                </div>

                <div class="form-tabs">
                    <button :class="['form-tab', isLogin ? 'active' : '']" @click="isLogin = true">登录</button>
                    <button :class="['form-tab', !isLogin ? 'active' : '']" @click="isLogin = false">注册</button>
                </div>

                <!-- 登录表单 -->
                <form v-if="isLogin" @submit.prevent="handleLogin">
                    <div class="form-group">
                        <label>用户名 / 邮箱</label>
                        <div class="form-input-wrapper">
                            <input type="text" class="form-input" v-model="loginForm.username" placeholder="请输入用户名或邮箱"
                                required autocomplete="username" id="login-username">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                style="position:absolute;left:14px;top:50%;transform:translateY(-50%)">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <div class="form-input-wrapper">
                            <input type="password" class="form-input" v-model="loginForm.password" placeholder="请输入密码"
                                required autocomplete="current-password" id="login-password">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                style="position:absolute;left:14px;top:50%;transform:translateY(-50%)">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                                </path>
                            </svg>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" :disabled="isLoading" id="btn-login">
                        <span v-if="isLoading" class="spinner"></span>
                        {{ isLoading ? '登录中...' : '登 录' }}
                    </button>
                </form>

                <!-- 注册表单 -->
                <form v-else @submit.prevent="handleRegister">
                    <div class="form-group">
                        <label>用户名</label>
                        <div class="form-input-wrapper">
                            <input type="text" class="form-input" v-model="registerForm.username" placeholder="3-20个字符"
                                required autocomplete="username" id="reg-username">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                style="position:absolute;left:14px;top:50%;transform:translateY(-50%)">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>邮箱 <span style="color: rgba(255,255,255,0.25)">（选填）</span></label>
                        <div class="form-input-wrapper">
                            <input type="email" class="form-input" v-model="registerForm.email"
                                placeholder="your@email.com" autocomplete="email" id="reg-email">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                style="position:absolute;left:14px;top:50%;transform:translateY(-50%)">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                </path>
                            </svg>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <div class="form-input-wrapper">
                            <input type="password" class="form-input" v-model="registerForm.password"
                                placeholder="至少6位密码" required autocomplete="new-password" id="reg-password">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                style="position:absolute;left:14px;top:50%;transform:translateY(-50%)">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                                </path>
                            </svg>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" :disabled="isLoading" id="btn-register">
                        <span v-if="isLoading" class="spinner"></span>
                        {{ isLoading ? '注册中...' : '注 册' }}
                    </button>
                </form>

                <div class="form-footer">
                    {{ isLogin ? '还没有账户？' : '已有账户？' }}
                    <a href="javascript:;" @click="isLogin = !isLogin">
                        {{ isLogin ? '立即注册' : '去登录' }}
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.2.47/vue.global.prod.min.js"></script>
    <script>
        // 粒子动画
        (function () {
            const container = document.getElementById('particles');
            const colors = ['#6366f1', '#8b5cf6', '#3b82f6', '#ec4899', '#a78bfa'];

            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 4 + 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color};
                    left: ${Math.random() * 100}%;
                    animation-duration: ${Math.random() * 15 + 10}s;
                    animation-delay: ${Math.random() * 10}s;
                    box-shadow: 0 0 ${size * 3}px ${color};
                `;
                container.appendChild(particle);
            }
        })();

        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const isLogin = ref(true);
                const isLoading = ref(false);
                const toast = ref({ show: false, message: '', type: 'success' });

                const loginForm = ref({ username: '', password: '' });
                const registerForm = ref({ username: '', email: '', password: '' });

                // 解析URL参数中的 redirect（SSO 跨域跳转用）
                const urlParams = new URLSearchParams(window.location.search);
                const ssoRedirect = urlParams.get('redirect') || '';

                // SSO: 用 token 生成 OTT 并跳回来源页面
                const ssoRedirectWithOtt = async (token) => {
                    try {
                        let backendRedirect = ssoRedirect;
                        if (ssoRedirect.includes('/sso/callback')) {
                            backendRedirect = 'http://refund.xjcerp.com/sso/callback';
                        }
                        const res = await fetch('/api/sso/generate-ott', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + token
                            },
                            body: JSON.stringify({ redirect: backendRedirect })
                        });
                        const json = await res.json();
                        if (json.code === 200) {
                            window.location.href = '/sso/callback?ott=' + json.data.ott;
                            return true;
                        }
                    } catch (e) {
                        console.error('SSO OTT生成失败', e);
                    }
                    return false;
                };

                // 检查是否已登录
                const token = localStorage.getItem('token');
                if (token) {
                    if (ssoRedirect) {
                        // 已登录 + 有 redirect → 直接生成 OTT 跳回
                        ssoRedirectWithOtt(token);
                    } else {
                        window.location.href = '/pages/video.html';
                    }
                }

                const showToast = (message, type = 'success') => {
                    toast.value = { show: true, message, type };
                    setTimeout(() => { toast.value.show = false; }, 3000);
                };

                const handleLogin = async () => {
                    if (isLoading.value) return;
                    if (!loginForm.value.username || !loginForm.value.password) {
                        showToast('请填写用户名和密码', 'error');
                        return;
                    }

                    isLoading.value = true;
                    try {
                        const res = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(loginForm.value)
                        });
                        const json = await res.json();

                        if (json.code === 200) {
                            localStorage.setItem('token', json.data.token);
                            localStorage.setItem('user', JSON.stringify(json.data.user));
                            showToast('登录成功！');
                            setTimeout(async () => {
                                // SSO: 如果有 redirect 参数，生成 OTT 后跳回来源页面
                                if (ssoRedirect) {
                                    const ok = await ssoRedirectWithOtt(json.data.token);
                                    if (ok) return; // 跳转成功
                                    // 失败则走正常流程
                                }
                                window.location.href = '/pages/video.html';
                            }, 800);
                        } else {
                            showToast(json.msg || '登录失败', 'error');
                        }
                    } catch (e) {
                        showToast('网络错误，请重试', 'error');
                    } finally {
                        isLoading.value = false;
                    }
                };

                const handleRegister = async () => {
                    if (isLoading.value) return;
                    if (!registerForm.value.username || !registerForm.value.password) {
                        showToast('请填写用户名和密码', 'error');
                        return;
                    }

                    isLoading.value = true;
                    try {
                        const res = await fetch('/api/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(registerForm.value)
                        });
                        const json = await res.json();

                        if (json.code === 200) {
                            localStorage.setItem('token', json.data.token);
                            localStorage.setItem('user', JSON.stringify(json.data.user));
                            showToast('注册成功！');
                            setTimeout(() => {
                                window.location.href = '/pages/video.html';
                            }, 800);
                        } else {
                            showToast(json.msg || '注册失败', 'error');
                        }
                    } catch (e) {
                        showToast('网络错误，请重试', 'error');
                    } finally {
                        isLoading.value = false;
                    }
                };

                return {
                    isLogin, isLoading, toast,
                    loginForm, registerForm,
                    handleLogin, handleRegister
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
